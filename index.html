<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oportunidades Aéreas · Visual Turismo</title>
<meta name="description" content="Bloqueios aéreos e exclusivos da Visual Turismo: consulte datas, lugares e preços.">
<meta name="theme-color" content="#003E7E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Oportunidades">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="xlsx.mini.min.js" defer></script>
<style>
/* ============================================================
   1. DESIGN TOKENS — Identidade visual Visual Turismo
   ============================================================ */
:root{
  --azul-escuro:#003E7E;
  --azul-medio:#005FB8;
  --azul-claro:#00AEEF;
  --azul-escuro-rgb:0,62,126;
  --azul-medio-rgb:0,95,184;
  --azul-claro-rgb:0,174,239;

  --branco:#ffffff;
  --cinza-bg:#F3F6FA;
  --cinza-card:#ffffff;
  --cinza-borda:#E3E9F1;
  --texto-principal:#0B2540;
  --texto-secundario:#5A7089;
  --texto-terciario:#8CA0B3;

  --sombra-sm: 0 1px 2px rgba(0,40,80,.06), 0 1px 1px rgba(0,40,80,.04);
  --sombra-md: 0 4px 14px rgba(0,40,80,.08), 0 2px 4px rgba(0,40,80,.04);
  --sombra-lg: 0 12px 32px rgba(0,40,80,.14), 0 4px 10px rgba(0,40,80,.06);
  --sombra-header: 0 2px 20px rgba(0,20,50,.18);

  --raio-sm:10px;
  --raio-md:16px;
  --raio-lg:22px;
  --raio-pill:999px;

  --font-display:'Poppins', sans-serif;
  --font-body:'Inter', sans-serif;

  --transicao: 220ms cubic-bezier(.4,0,.2,1);

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}

body.dark{
  --cinza-bg:#0A1826;
  --cinza-card:#122234;
  --cinza-borda:#1E3349;
  --texto-principal:#EAF2FA;
  --texto-secundario:#9FB4C7;
  --texto-terciario:#6C8399;
  --sombra-sm: 0 1px 2px rgba(0,0,0,.3);
  --sombra-md: 0 4px 14px rgba(0,0,0,.35);
  --sombra-lg: 0 12px 32px rgba(0,0,0,.5);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--cinza-bg);
  color:var(--texto-principal);
  transition:background var(--transicao), color var(--transicao);
  overflow-x:hidden;
  padding-bottom:calc(64px + var(--safe-bottom));
  padding-left:var(--safe-left); padding-right:var(--safe-right);
}
h1,h2,h3,.font-display{font-family:var(--font-display);}
button{font-family:inherit;}
a{color:inherit;}
::selection{background:rgba(var(--azul-claro-rgb),.3);}

/* Scrollbar (desktop) */
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--cinza-borda); border-radius:8px;}

/* ============================================================
   2. SPLASH / LOADING SCREEN
   ============================================================ */
#splash{
  position:fixed; top:0; right:0; bottom:0; left:0; inset:0; z-index:9999;
  background:linear-gradient(160deg, var(--azul-escuro), var(--azul-medio) 65%, var(--azul-claro) 130%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:#fff; gap:18px;
  transition:opacity .5s ease, visibility .5s ease;
}
#splash.hide{opacity:0; visibility:hidden; pointer-events:none;}
#splash .splash-logo{
  width:84px; height:84px; border-radius:22px; background:rgba(255,255,255,.12);
  display:flex; align-items:center; justify-content:center; font-size:34px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  animation:floaty 2.4s ease-in-out infinite;
}
@keyframes floaty{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-8px);}
}
#splash .splash-title{font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:.3px;}
#splash .splash-sub{font-size:13px; opacity:.8;}
.spinner{
  width:34px; height:34px; border-radius:50%;
  border:3px solid rgba(255,255,255,.25); border-top-color:#fff;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ============================================================
   3. HEADER
   ============================================================ */
header.app-header{
  position:-webkit-sticky; position:sticky; top:0; z-index:500;
  padding:calc(14px + var(--safe-top)) calc(16px + var(--safe-right)) 16px calc(16px + var(--safe-left));
  background:linear-gradient(135deg, var(--azul-escuro), var(--azul-medio) 80%);
  color:#fff;
  box-shadow:var(--sombra-header);
  border-radius:0 0 24px 24px;
}
.header-top{
  display:flex; align-items:center; gap:12px; margin-bottom:14px;
}
.logo-slot{
  width:46px; height:46px; border-radius:14px;
  background:rgba(255,255,255,.14);
  display:flex; align-items:center; justify-content:center;
  flex:none; overflow:hidden;
  border:1px solid rgba(255,255,255,.18);
}
.logo-slot img{width:100%; height:100%; object-fit:cover;}
.logo-slot i{font-size:20px;}
.header-titles{flex:1; min-width:0;}
.header-titles h1{
  margin:0; font-size:19px; font-weight:700; letter-spacing:.2px; line-height:1.15;
}
.header-titles p{
  margin:2px 0 0; font-size:12.5px; opacity:.82; font-weight:500;
}
.header-actions{display:flex; gap:8px; flex:none;}
.icon-btn{
  width:38px; height:38px; border-radius:12px; border:none;
  background:rgba(255,255,255,.14); color:#fff; font-size:15px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:background var(--transicao), transform var(--transicao);
}
.icon-btn:hover{background:rgba(255,255,255,.25);}
.icon-btn:active{transform:scale(.92);}

.search-wrap{position:relative;}
.search-wrap i.fa-magnifying-glass{
  position:absolute; left:16px; top:50%; transform:translateY(-50%);
  color:var(--azul-escuro); opacity:.5; font-size:14px;
}
#globalSearch{
  width:100%; border:none; outline:none; border-radius:var(--raio-pill);
  padding:13px 40px 13px 42px; font-size:16px; font-family:var(--font-body);
  background:#fff; color:var(--texto-principal);
  box-shadow:var(--sombra-md);
}
#globalSearch::placeholder{color:var(--texto-terciario);}
.search-clear{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  width:28px; height:28px; border-radius:50%; border:none;
  background:var(--cinza-bg); color:var(--texto-secundario);
  display:none; align-items:center; justify-content:center; cursor:pointer;
}

/* ============================================================
   4. INDICATORS
   ============================================================ */
.indicators{
  display:grid; grid-template-columns:repeat(4,1fr);
  gap:8px; padding:14px 12px 0;
}
.indicator-card{
  background:var(--cinza-card); border:1px solid var(--cinza-borda);
  border-radius:var(--raio-md); padding:11px 8px; text-align:center;
  box-shadow:var(--sombra-sm);
  transition:background var(--transicao), border-color var(--transicao), transform var(--transicao);
}
.indicator-card .val{
  font-family:var(--font-display); font-weight:800; font-size:19px; color:var(--azul-medio);
  display:block; line-height:1.1;
}
body.dark .indicator-card .val{color:var(--azul-claro);}
.indicator-card .lbl{
  font-size:9.5px; color:var(--texto-secundario); text-transform:uppercase;
  letter-spacing:.4px; font-weight:600; display:block; margin-top:3px;
}

/* ============================================================
   5. FILTERS
   ============================================================ */
.filters-section{margin:14px 12px 0;}
.filters-toggle{
  width:100%; display:flex; align-items:center; justify-content:space-between;
  background:var(--cinza-card); border:1px solid var(--cinza-borda);
  border-radius:var(--raio-md); padding:13px 16px; cursor:pointer;
  box-shadow:var(--sombra-sm); color:var(--texto-principal); font-weight:600; font-size:14px;
}
.filters-toggle .left{display:flex; align-items:center; gap:9px;}
.filters-toggle i.fa-sliders{color:var(--azul-medio);}
.filter-count-badge{
  background:var(--azul-medio); color:#fff; font-size:11px; font-weight:700;
  border-radius:var(--raio-pill); padding:1px 8px; margin-left:6px;
}
.filters-toggle .chev{transition:transform var(--transicao); color:var(--texto-terciario);}
.filters-toggle.open .chev{transform:rotate(180deg);}

.filters-panel{
  max-height:0; overflow:hidden; transition:max-height .35s ease;
  background:var(--cinza-card); border:1px solid var(--cinza-borda); border-top:none;
  border-radius:0 0 var(--raio-md) var(--raio-md);
  margin-top:-1px;
}
.filters-panel.open{max-height:1400px;}
.filters-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:14px 16px 4px;
}
.filter-field{display:flex; flex-direction:column; gap:5px;}
.filter-field.full{grid-column:1 / -1;}
.filter-field label{
  font-size:11px; font-weight:600; color:var(--texto-secundario);
  text-transform:uppercase; letter-spacing:.3px;
}
.filter-field select, .filter-field input[type=date], .filter-field input[type=number]{
  border:1px solid var(--cinza-borda); border-radius:var(--raio-sm);
  padding:10px 12px; font-size:16px; background:var(--cinza-bg); width:100%; min-width:0;
  color:var(--texto-principal); font-family:var(--font-body); outline:none;
  transition:border-color var(--transicao);
}
.filter-field select, .filter-field input[type=number]{
  appearance:none; -webkit-appearance:none;
}
.filter-field select{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%235A7089'/></svg>");
  background-repeat:no-repeat; background-position:right 12px center;
}
.filter-field select:focus, .filter-field input:focus{border-color:var(--azul-medio);}
.date-row{display:flex; gap:8px;}
.date-row .filter-field{flex:1;}

.toggle-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px; margin:6px 16px 10px; background:var(--cinza-bg);
  border-radius:var(--raio-sm); border:1px solid var(--cinza-borda);
}
.toggle-row span{font-size:13px; font-weight:600;}
.switch{position:relative; width:42px; height:24px; flex:none;}
.switch input{opacity:0; width:0; height:0;}
.slider-toggle{
  position:absolute; top:0; right:0; bottom:0; left:0; inset:0; background:var(--cinza-borda); border-radius:99px; cursor:pointer;
  transition:background var(--transicao);
}
.slider-toggle::before{
  content:''; position:absolute; width:18px; height:18px; left:3px; top:3px;
  background:#fff; border-radius:50%; transition:transform var(--transicao);
  box-shadow:0 1px 3px rgba(0,0,0,.3);
}
.switch input:checked + .slider-toggle{background:var(--azul-medio);}
.switch input:checked + .slider-toggle::before{transform:translateX(18px);}

.filters-actions{
  display:flex; gap:8px; padding:6px 16px 16px; flex-wrap:wrap;
}
.btn{
  border:none; border-radius:var(--raio-sm); padding:10px 14px; font-size:13px;
  font-weight:600; cursor:pointer; display:flex; align-items:center; gap:7px;
  transition:transform var(--transicao), background var(--transicao), box-shadow var(--transicao);
  font-family:var(--font-body);
}
.btn:active{transform:scale(.96);}
.btn-primary{background:var(--azul-medio); color:#fff; box-shadow:var(--sombra-sm);}
.btn-primary:hover{background:var(--azul-escuro);}
.btn-ghost{background:var(--cinza-bg); color:var(--texto-secundario); border:1px solid var(--cinza-borda);}
.btn-ghost:hover{color:var(--texto-principal);}
.btn-block{flex:1; justify-content:center;}

/* ============================================================
   6. TOOLBAR (sort + count + quick actions)
   ============================================================ */
.toolbar{
  display:flex; align-items:center; gap:10px; margin:16px 12px 8px; flex-wrap:wrap;
}
.result-count{font-size:13px; color:var(--texto-secundario); font-weight:500; flex:1; min-width:120px;}
.result-count b{color:var(--texto-principal); font-weight:700;}
.sort-select{
  border:1px solid var(--cinza-borda); background:var(--cinza-card); border-radius:var(--raio-sm);
  padding:8px 30px 8px 12px; font-size:16px; font-weight:600; color:var(--texto-principal);
  outline:none; appearance:none; -webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%235A7089'/></svg>");
  background-repeat:no-repeat; background-position:right 10px center;
}
.quick-actions{display:flex; gap:6px;}
.quick-actions .icon-btn{
  background:var(--cinza-card); color:var(--azul-medio); border:1px solid var(--cinza-borda);
  width:34px; height:34px; font-size:13px;
}
.quick-actions .icon-btn:hover{background:var(--azul-medio); color:#fff;}

/* ============================================================
   7. RESULTS GRID / CARDS
   ============================================================ */
#resultsGrid{
  display:grid; grid-template-columns:1fr; gap:12px; padding:4px 12px 20px;
}
@media(min-width:640px){ #resultsGrid{grid-template-columns:1fr 1fr;} }
@media(min-width:1000px){ #resultsGrid{grid-template-columns:1fr 1fr 1fr;} }
@media(min-width:1360px){ #resultsGrid{grid-template-columns:repeat(4,1fr);} }

.opp-card{
  background:var(--cinza-card); border:1px solid var(--cinza-borda);
  border-radius:var(--raio-lg); padding:16px; position:relative; overflow:hidden;
  box-shadow:var(--sombra-sm); cursor:default;
  transition:transform var(--transicao), box-shadow var(--transicao), border-color var(--transicao);
  animation:cardIn .35s ease both;
}
@keyframes cardIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
.opp-card:hover{transform:translateY(-4px); box-shadow:var(--sombra-lg); border-color:rgba(var(--azul-medio-rgb),.35);}
.opp-card::before{
  content:''; position:absolute; left:0; top:0; bottom:0; width:4px;
  background:linear-gradient(var(--azul-claro), var(--azul-medio));
}
.opp-card.tipo-exclusivo::before{background:linear-gradient(#FFB300, #FF7A00);}

.card-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:12px;}
.card-top-right{display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex:none;}
.price-tag{
  font-family:var(--font-display); font-weight:800; font-size:16px;
  color:var(--azul-escuro); white-space:nowrap;
}
body.dark .price-tag{color:var(--azul-claro);}
.route{display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 7px; font-family:var(--font-display); font-weight:700; font-size:16.5px;}
.route i.fa-plane{color:var(--azul-medio); font-size:14px; align-self:center;}
.route .code{letter-spacing:.5px;}
.route .arrow{color:var(--texto-terciario); font-weight:500; font-size:14px;}
.route .city-sub{
  font-family:var(--font-body); font-weight:500; font-size:11px;
  color:var(--texto-terciario); text-transform:none; letter-spacing:0;
}
.badge{
  font-size:10px; font-weight:700; padding:4px 10px; border-radius:var(--raio-pill);
  text-transform:uppercase; letter-spacing:.4px; flex:none; white-space:nowrap;
}
.badge-bloqueio{background:rgba(var(--azul-medio-rgb),.12); color:var(--azul-medio);}
.badge-exclusivo{background:rgba(255,140,0,.14); color:#C56A00;}
body.dark .badge-exclusivo{color:#FFB74D;}

.card-info{display:grid; grid-template-columns:1fr 1fr; gap:9px 12px; margin-bottom:10px;}
.info-item{display:flex; flex-direction:column; gap:2px;}
.info-item .lbl{font-size:10px; color:var(--texto-terciario); text-transform:uppercase; font-weight:600; letter-spacing:.3px;}
.info-item .v{font-size:13px; font-weight:600; color:var(--texto-principal); display:flex; align-items:center; gap:5px;}
.info-item .v i{color:var(--azul-medio); font-size:11px; width:12px;}

.seats-chip{
  display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700;
  padding:4px 10px; border-radius:var(--raio-pill); background:rgba(46,160,90,.12); color:#1F8A4C;
}
.seats-chip.low{background:rgba(230,160,30,.14); color:#B0790C;}
.seats-chip.none{background:rgba(210,60,60,.12); color:#C3392F;}
body.dark .seats-chip{background:rgba(46,200,110,.15); color:#4ADE80;}
body.dark .seats-chip.low{background:rgba(240,180,40,.15); color:#FBBF24;}
body.dark .seats-chip.none{background:rgba(240,80,80,.15); color:#F87171;}

.card-footer{
  border-top:1px dashed var(--cinza-borda); margin-top:4px; padding-top:10px;
  display:flex; align-items:center; justify-content:space-between; gap:8px;
}
.cia-tag{font-size:12px; font-weight:600; color:var(--texto-secundario); display:flex; align-items:center; gap:6px;}
.cia-dot{width:7px; height:7px; border-radius:50%; background:var(--azul-claro); flex:none;}
.card-obs{
  font-size:11.5px; color:var(--texto-terciario); margin-top:8px; line-height:1.4;
  padding-top:8px; border-top:1px dashed var(--cinza-borda);
}

/* Empty state */
.empty-state{
  grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--texto-secundario);
}
.empty-state i{font-size:40px; color:var(--cinza-borda); margin-bottom:14px;}
.empty-state h3{margin:0 0 6px; font-size:16px; color:var(--texto-principal);}
.empty-state p{margin:0; font-size:13px;}

/* Sentinel / load more */
#sentinel{grid-column:1/-1; text-align:center; padding:16px; color:var(--texto-terciario); font-size:12px;}
.load-more-btn{
  grid-column:1/-1; margin:6px auto 0; padding:11px 22px; border-radius:var(--raio-pill);
  background:var(--cinza-card); border:1px solid var(--cinza-borda); color:var(--azul-medio);
  font-weight:700; font-size:13px; cursor:pointer;
}

/* ============================================================
   8. FLOATING BUTTONS
   ============================================================ */
#backToTop{
  position:fixed; right:16px; bottom:calc(20px + var(--safe-bottom)); z-index:400;
  width:46px; height:46px; border-radius:50%; border:none;
  background:var(--azul-escuro); color:#fff; font-size:16px;
  box-shadow:var(--sombra-lg); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  opacity:0; transform:translateY(20px) scale(.8); pointer-events:none;
  transition:opacity var(--transicao), transform var(--transicao);
}
#backToTop.show{opacity:1; transform:translateY(0) scale(1); pointer-events:auto;}

/* Toast */
#toast{
  position:fixed; left:50%; bottom:calc(24px + var(--safe-bottom)); z-index:9000;
  transform:translate(-50%, 20px); background:var(--texto-principal); color:var(--cinza-bg);
  padding:11px 20px; border-radius:var(--raio-pill); font-size:13px; font-weight:600;
  box-shadow:var(--sombra-lg); opacity:0; transition:opacity .3s ease, transform .3s ease;
  pointer-events:none; max-width:88vw; text-align:center;
}
#toast.show{opacity:1; transform:translate(-50%, 0);}

/* Import modal */
.modal-overlay{
  position:fixed; top:0; right:0; bottom:0; left:0; inset:0; background:rgba(5,15,30,.55); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  z-index:8000; display:flex; align-items:flex-end; justify-content:center;
  opacity:0; visibility:hidden; transition:opacity var(--transicao), visibility var(--transicao);
}
.modal-overlay.show{opacity:1; visibility:visible;}
@media(min-width:640px){ .modal-overlay{align-items:center;} }
.modal-box{
  background:var(--cinza-card); border-radius:22px 22px 0 0; width:100%; max-width:460px;
  padding:22px 20px calc(20px + var(--safe-bottom)); transform:translateY(30px);
  transition:transform var(--transicao); box-shadow:var(--sombra-lg);
}
.modal-overlay.show .modal-box{transform:translateY(0);}
@media(min-width:640px){ .modal-box{border-radius:22px;} }
.modal-box h3{margin:0 0 6px; font-size:16px;}
.modal-box p{margin:0 0 16px; font-size:13px; color:var(--texto-secundario); line-height:1.5;}
.file-drop{
  border:2px dashed var(--cinza-borda); border-radius:var(--raio-md); padding:26px 16px;
  text-align:center; cursor:pointer; margin-bottom:14px; transition:border-color var(--transicao);
}

<script>
/* ==================================================================
   OPORTUNIDADES AÉREAS — Visual Turismo (PWA somente consulta)
   Os dados vêm do arquivo dados.xlsx publicado junto com o app.
   Para atualizar, basta substituir o dados.xlsx no GitHub.
   ================================================================== */
(function () {
  "use strict";

  /* ----------------------------------------------------------------
     0. CONFIGURAÇÕES (pode editar)
     ---------------------------------------------------------------- */
  const CONFIG = {
    arquivoDados: "dados.xlsx",
    abaEstoque: "estoque geral",       // nome da aba (sem diferenciar maiúsculas/acentos)
    abaExclusivos: "exclusivos",       // basta conter esta palavra
    ocultarVoosPassados: true,         // esconde saídas anteriores a hoje
    // Regra do "valor sem taxa". null = não mostrar.
    // Exemplos: { tipo: "percentual", valor: 10 }  -> valor final - 10%
    //           { tipo: "fixo", valor: 100 }       -> valor final - R$ 100
    regraSemTaxa: null,
    reverificarAposMinutos: 5          // ao voltar para o app, checa novidades
  };

  /* ----------------------------------------------------------------
     1. UTILITÁRIOS E NORMALIZAÇÃO
     ---------------------------------------------------------------- */
  const CITY_MAP = {
    AEP: ["Buenos Aires", "Aeroparque"], AJU: ["Aracaju"], AUA: ["Aruba", "Oranjestad"],
    BEL: ["Belém"], BPS: ["Porto Seguro"], BRC: ["Bariloche"],
    BSB: ["Brasília"], BYO: ["Bonito"], CGB: ["Cuiabá"], CGH: ["São Paulo", "Congonhas"],
    CGR: ["Campo Grande"], CLV: ["Caldas Novas"], CNF: ["Belo Horizonte", "Confins"],
    CPH: ["Copenhague"], CPT: ["Cidade do Cabo"], CUR: ["Curaçao"], CUZ: ["Cusco"],
    CWB: ["Curitiba"], EZE: ["Buenos Aires", "Ezeiza"], FEN: ["Fernando de Noronha"],
    FLN: ["Florianópolis"], FOR: ["Fortaleza"], FTE: ["El Calafate"],
    GIG: ["Rio de Janeiro", "Galeão"], GRU: ["São Paulo", "Guarulhos"], GYN: ["Goiânia"],
    IGU: ["Foz do Iguaçu"], IOS: ["Ilhéus"], JJD: ["Jericoacoara"], JOI: ["Joinville"],
    JPA: ["João Pessoa"], LDB: ["Londrina"], LIS: ["Lisboa"], MAO: ["Manaus"],
    MCO: ["Orlando"], MCP: ["Macapá"], MCZ: ["Maceió"], MDZ: ["Mendoza"],
    MGF: ["Maringá"], MIA: ["Miami"], MVD: ["Montevidéu"], NAT: ["Natal"],
    NVT: ["Navegantes", "Balneário Camboriú"], OPS: ["Sinop"], PDP: ["Punta del Este"],
    PMW: ["Palmas"], POA: ["Porto Alegre"], PRG: ["Praga"], PUJ: ["Punta Cana"],
    PVH: ["Porto Velho"], RAO: ["Ribeirão Preto"], RBR: ["Rio Branco"], REC: ["Recife"],
    SCL: ["Santiago"], SDU: ["Rio de Janeiro", "Santos Dumont"], SJP: ["São José do Rio Preto"],
    SLA: ["Salta"], SLZ: ["São Luís"], SSA: ["Salvador"], THE: ["Teresina"],
    UDI: ["Uberlândia"], UNA: ["Una", "Comandatuba"], USH: ["Ushuaia"],
    VCP: ["Campinas", "Viracopos"], VIX: ["Vitória"], XAP: ["Chapecó"],
    JNB: ["Joanesburgo"], JTC: ["Bauru"]
  };
  const CITY_NAMES = {"BELEM": "Belém", "BRASILIA": "Brasília", "CALAFATE": "El Calafate", "CAPE TOWN": "Cidade do Cabo", "CHAPECO": "Chapecó", "COPENHAGEN": "Copenhague", "CUIABA": "Cuiabá", "FLORIANOPOLIS": "Florianópolis", "FOZ DO IGUACU": "Foz do Iguaçu", "GOIANIA": "Goiânia", "ILHEUS": "Ilhéus", "JOAO PESSOA": "João Pessoa", "MACAPA": "Macapá", "MACEIO": "Maceió", "MARABA": "Marabá", "MARINGA": "Maringá", "MONTEVIDEO": "Montevidéu", "MONTEVIDEU": "Montevidéu", "NAO INFORMADO": "Não informado", "NEW YORK": "Nova York", "RIBEIRAO PRETO": "Ribeirão Preto", "SAO JOSE DO RIO PRETO": "São José do Rio Preto", "SAO LUIS": "São Luís", "SAO PAULO": "São Paulo", "SAO PAULO (GUARULHOS)": "São Paulo (Guarulhos)", "UBERLANDIA": "Uberlândia", "VITORIA": "Vitória"};

  const $ = (id) => document.getElementById(id);
  const grid = $("resultsGrid");

  function stripAccents(s) {
    return String(s == null ? "" : s).normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }
  function normKey(s) {
    return stripAccents(s).toUpperCase().replace(/\s+/g, " ").trim();
  }
  function cityName(raw) {
    const k = normKey(raw);
    if (!k) return "";
    if (CITY_NAMES[k]) return CITY_NAMES[k];
    const small = { de: 1, do: 1, da: 1, dos: 1, das: 1, e: 1, del: 1, la: 1 };
    return k.toLowerCase().split(" ").map((w, i) => (i && small[w]) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
  }
  function cityFromIata(code) {
    const e = CITY_MAP[normKey(code)];
    return e ? e[0] : normKey(code);
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  const pad = (n) => String(n).padStart(2, "0");
  function todayISO() {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  // Converte célula de data (número serial do Excel, texto DD/MM/AAAA ou Date) em AAAA-MM-DD
  function toISODate(v) {
    if (v == null || v === "") return null;
    if (typeof v === "number" && isFinite(v)) {
      const p = XLSX.SSF.parse_date_code(v);
      return p ? `${p.y}-${pad(p.m)}-${pad(p.d)}` : null;
    }
    if (v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${pad(v.getMonth() + 1)}-${pad(v.getDate())}`;
    const s = String(v).trim();
    let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
    m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    return null;
  }
  function toNumber(v) {
    if (v == null || v === "") return null;
    if (typeof v === "number") return v;
    let s = String(v).replace(/[^\d.,-]/g, "");
    if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
    const n = parseFloat(s);
    return isNaN(n) ? null : n;
  }
  function fmtDateBR(iso) {
    if (!iso) return "—";
    const p = String(iso).split("-");
    return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : iso;
  }
  function fmtCurrency(v) {
    if (v == null || v === "" || isNaN(v)) return null;
    return Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  }
  function fmtStamp(ms) {
    const d = new Date(ms);
    return `${pad(d.getDate())}/${pad(d.getMonth() + 1)} às ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function valorSemTaxa(valor) {
    const r = CONFIG.regraSemTaxa;
    if (!r || valor == null) return null;
    const v = r.tipo === "percentual" ? valor * (1 - r.valor / 100) : valor - r.valor;
    return v > 0 ? Math.round(v * 100) / 100 : null;
  }

  /* ----------------------------------------------------------------
     2. LEITURA DA PLANILHA
     ---------------------------------------------------------------- */
  function findSheet(wb, needle) {
    const n = normKey(needle);
    const name = wb.SheetNames.find(s => normKey(s) === n) || wb.SheetNames.find(s => normKey(s).includes(n));
    return name ? wb.Sheets[name] : null;
  }
  function sheetRows(ws) {
    return XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: false });
  }
  // Acha a linha de cabeçalho e devolve { index, col(nome) }
  function headerInfo(rows, mustHave) {
    const idx = rows.findIndex(r => r && r.some(c => normKey(c) === mustHave));
    if (idx < 0) return null;
    const H = rows[idx].map(normKey);
    const col = (...names) => {
      for (const nm of names) {
        const i = H.findIndex(h => h === nm || h.startsWith(nm));
        if (i >= 0) return i;
      }
      return -1;
    };
    return { index: idx, col };
  }

  function parseWorkbook(buf) {
    const wb = XLSX.read(buf, { type: "array" });
    const out = [];
    const avisos = [];

    // --- Aba Estoque Geral (obrigatória)
    const ws = findSheet(wb, CONFIG.abaEstoque);
    if (!ws) throw new Error('A aba "Estoque Geral" não foi encontrada na planilha.');
    const rows = sheetRows(ws);
    const h = headerInfo(rows, "DATA_EMBARQUE");
    if (!h) throw new Error('Cabeçalho da aba "Estoque Geral" não encontrado (coluna DATA_EMBARQUE).');
    const C = {
      area: h.col("BUSINESS"), od: h.col("OD"), orig: h.col("CIDADE_ORIGEM"), dest: h.col("CIDADE_DESTINO"),
      ds: h.col("DATA_EMBARQUE"), dr: h.col("DATA_RETORNO"), dias: h.col("NR_DIAS"), noites: h.col("NR_NOITES"),
      cia: h.col("DS_CIA"), valor: h.col("PRECO FINAL"), lug: h.col("DISPO")
    };
    const faltando = Object.entries(C).filter(([, i]) => i < 0).map(([k]) => k);
    if (faltando.length) throw new Error("Colunas não encontradas na aba Estoque Geral: " + faltando.join(", "));

    for (let i = h.index + 1; i < rows.length; i++) {
      const r = rows[i];
      const ds = toISODate(r[C.ds]);
      if (!ds || !r[C.orig]) continue;
      const area = normKey(r[C.area]);
      out.push({
        tipo: "Bloqueio",
        origem: cityName(r[C.orig]),
        destino: cityName(r[C.dest]),
        rota: normKey(r[C.od]) || null,
        ds, dr: toISODate(r[C.dr]),
        dias: toNumber(r[C.dias]), noites: toNumber(r[C.noites]),
        cia: normKey(r[C.cia]),
        valor: toNumber(r[C.valor]),
        lug: toNumber(r[C.lug]),
        area: area === "INTERNACIONAL" ? "Internacional" : area === "NACIONAL" ? "Nacional" : cityName(area)
      });
    }

    // --- Aba Exclusivos Visual (opcional)
    const wx = findSheet(wb, CONFIG.abaExclusivos);
    if (wx) {
      const rx = sheetRows(wx);
      const hx = headerInfo(rx, "ORIGEM");
      if (hx) {
        const X = {
          id: hx.col("ID DO BLOQUEIO", "ID"), loc: hx.col("LOCALIZADOR"), pacote: hx.col("PACOTE"),
          orig: hx.col("ORIGEM"), dest: hx.col("DESTINO"), ida: hx.col("IDA"), volta: hx.col("VOLTA"),
          cia: hx.col("CIA"), lug: hx.col("LUGARES"), valor: hx.col("VALOR", "PRECO")
        };
        for (let i = hx.index + 1; i < rx.length; i++) {
          const r = rx[i];
          const ds = toISODate(r[X.ida]);
          if (!ds || !r[X.orig]) continue;
          const o = normKey(r[X.orig]), d = normKey(r[X.dest]);
          const isCode = (s) => /^[A-Z]{3}$/.test(s);
          const dr = toISODate(r[X.volta]);
          const dias = dr ? Math.round((new Date(dr) - new Date(ds)) / 86400000) + 1 : null;
          // A célula de ID às vezes vem formatada como data no Excel: aqui ela chega como número (ex.: 1434)
          const idRaw = X.id >= 0 ? r[X.id] : null;
          out.push({
            tipo: "Exclusivo Visual",
            origem: isCode(o) ? cityFromIata(o) : cityName(o),
            destino: isCode(d) ? cityFromIata(d) : cityName(d),
            rota: isCode(o) && isCode(d) ? o + d : null,
            ds, dr, dias, noites: dias ? dias - 1 : null,
            cia: normKey(r[X.cia]),
            valor: X.valor >= 0 ? toNumber(r[X.valor]) : null,
            lug: toNumber(r[X.lug]),
            area: null,
            id: idRaw == null ? null : String(typeof idRaw === "number" ? Math.round(idRaw) : idRaw),
            localizador: X.loc >= 0 && r[X.loc] ? String(r[X.loc]).trim() : null,
            pacote: X.pacote >= 0 && r[X.pacote] ? String(r[X.pacote]).trim() : null
          });
        }
      } else avisos.push("Aba de exclusivos sem cabeçalho reconhecível");
    }
    if (!out.length) throw new Error("Nenhuma linha válida encontrada na planilha.");
    return out;
  }

  /* ----------------------------------------------------------------
     3. CACHE LOCAL (IndexedDB) — permite abrir sem internet
     ---------------------------------------------------------------- */
  const DB = {
    _db: null,
    open() {
      if (this._db) return Promise.resolve(this._db);
      return new Promise((res, rej) => {
        if (!("indexedDB" in window)) return rej(new Error("sem IndexedDB"));
        const req = indexedDB.open("vt-oportunidades", 1);
        req.onupgradeneeded = () => req.result.createObjectStore("kv");
        req.onsuccess = () => { this._db = req.result; res(this._db); };
        req.onerror = () => rej(req.error);
      });
    },
    async get(key) {
      try {
        const db = await this.open();
        return await new Promise((res, rej) => {
          const r = db.transaction("kv").objectStore("kv").get(key);
          r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error);
        });
      } catch (e) { return null; }
    },
    async set(key, val) {
      try {
        const db = await this.open();
        await new Promise((res, rej) => {
          const t = db.transaction("kv", "readwrite");
          t.objectStore("kv").put(val, key);
          t.oncomplete = res; t.onerror = () => rej(t.error);
        });
      } catch (e) { console.warn("Não foi possível salvar o cache:", e); }
    }
  };

  /* ----------------------------------------------------------------
     4. ESTADO
     ---------------------------------------------------------------- */
  const EMPTY_FILTERS = { origem: "", destino: "", cia: "", tipo: "", dataIni: "", dataFim: "", lugaresMin: "", valorMax: "", somenteDisp: false };
  const state = {
    all: [], filtered: [], renderedCount: 0, pageSize: 24,
    sort: "data_asc", search: "", filters: { ...EMPTY_FILTERS },
    meta: null,          // { etag, lastModified, publishedAt, checkedAt }
    lastCheck: 0, checking: false
  };

  function setData(records) {
    const hoje = todayISO();
    state.all = CONFIG.ocultarVoosPassados ? records.filter(r => !r.ds || r.ds >= hoje) : records.slice();
    state.all.forEach(r => {
      r._blob = stripAccents([r.tipo, r.origem, r.destino, r.rota, r.cia, r.area, r.localizador, r.id, r.pacote,
        fmtDateBR(r.ds), fmtDateBR(r.dr)].filter(Boolean).join(" ")).toLowerCase();
    });
    populateFilterOptions();
    applyFilters();
  }

  /* ----------------------------------------------------------------
     5. STATUS "ATUALIZADO EM"
     ---------------------------------------------------------------- */
  function setStatus(kind, text) {
    const el = $("statusLine");
    el.className = "status-line " + kind;
    $("statusText").textContent = text;
  }
  function stampText() {
    const m = state.meta;
    if (!m) return "";
    return "Atualizado em " + fmtStamp(m.publishedAt || m.checkedAt);
  }

  /* ----------------------------------------------------------------
     6. BUSCA DA VERSÃO NOVA
     ---------------------------------------------------------------- */
  async function checkForUpdates(opts = {}) {
    if (state.checking) return;
    state.checking = true;
    if (!state.all.length || opts.manual) setStatus("checking", "Verificando atualizações…");
    try {
      // "no-cache": sempre pergunta ao servidor se o arquivo mudou (resposta 304 não baixa de novo)
      const resp = await fetch(CONFIG.arquivoDados, { cache: "no-cache" });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const etag = resp.headers.get("ETag") || "";
      const lm = resp.headers.get("Last-Modified") || "";
      const m = state.meta;
      const unchanged = m && state.all.length && ((etag && etag === m.etag) || (!etag && lm && lm === m.lastModified));
      if (unchanged) {
        m.checkedAt = Date.now();
        await DB.set("meta", m);
        setStatus("", stampText());
        if (opts.manual) toast("Você já está com a versão mais recente.");
      } else {
        if (typeof XLSX === "undefined") throw new Error("Leitor de planilha não carregou");
        const buf = await resp.arrayBuffer();
        const records = parseWorkbook(buf);
        const lmMs = lm ? Date.parse(lm) : NaN;
        state.meta = { etag, lastModified: lm, publishedAt: isNaN(lmMs) ? Date.now() : lmMs, checkedAt: Date.now() };
        const hadData = state.all.length > 0;
        await DB.set("records", records);
        await DB.set("meta", state.meta);
        setData(records);
        setStatus("", stampText());
        if (hadData) toast("Dados atualizados.");
      }
      state.lastCheck = Date.now();
    } catch (err) {
      console.warn("Falha ao buscar atualização:", err);
      if (state.all.length) {
        setStatus("offline", (navigator.onLine ? "Sem conexão com o servidor · " : "Sem internet · ") + stampText().replace("Atualizado", "versão salva"));
      } else {
        setStatus("offline", "Sem conexão e nenhuma versão salva");
        renderLoadError(err);
      }
    } finally {
      state.checking = false;
      hideSplash();
    }
  }

  /* ----------------------------------------------------------------
     7. FILTROS, ORDENAÇÃO, INDICADORES (igual ao modelo original)
     ---------------------------------------------------------------- */
  function populateFilterOptions() {
    const origens = new Set(), destinos = new Set(), cias = new Set(), tipos = new Set();
    state.all.forEach(r => {
      if (r.origem) origens.add(r.origem);
      if (r.destino) destinos.add(r.destino);
      if (r.cia) cias.add(r.cia);
      if (r.tipo) tipos.add(r.tipo);
    });
    fillSelect($("fOrigem"), origens, "Todas");
    fillSelect($("fDestino"), destinos, "Todos");
    fillSelect($("fCia"), cias, "Todas");
    fillSelect($("fTipo"), tipos, "Todos");
  }
  function fillSelect(sel, values, allLabel) {
    const current = sel.value;
    const sorted = Array.from(values).sort((a, b) => a.localeCompare(b, "pt-BR"));
    sel.innerHTML = `<option value="">${allLabel}</option>` +
      sorted.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
    if (sorted.includes(current)) sel.value = current;
  }

  function applyFilters() {
    const f = state.filters;
    const terms = stripAccents(state.search || "").toLowerCase().trim().split(/\s+/).filter(Boolean);
    state.filtered = state.all.filter(r => {
      if (terms.length && !terms.every(t => r._blob.includes(t))) return false;
      if (f.origem && r.origem !== f.origem) return false;
      if (f.destino && r.destino !== f.destino) return false;
      if (f.cia && r.cia !== f.cia) return false;
      if (f.tipo && r.tipo !== f.tipo) return false;
      if (f.dataIni && r.ds && r.ds < f.dataIni) return false;
      if (f.dataFim && r.ds && r.ds > f.dataFim) return false;
      if (f.lugaresMin !== "" && (r.lug == null || r.lug < Number(f.lugaresMin))) return false;
      if (f.valorMax !== "" && (r.valor == null || r.valor > Number(f.valorMax))) return false;
      if (f.somenteDisp && (r.lug == null || r.lug <= 0)) return false;
      return true;
    });
    sortFiltered();
    updateIndicators();
    updateFilterBadge();
    renderReset();
  }

  function sortFiltered() {
    const s = state.sort, arr = state.filtered;
    const cmpStr = (a, b) => (a || "").localeCompare(b || "", "pt-BR");
    const exclFirst = (a, b) => (b.tipo !== "Bloqueio") - (a.tipo !== "Bloqueio");
    const by = {
      data_asc: (a, b) => (a.ds || "9999").localeCompare(b.ds || "9999"),
      data_desc: (a, b) => (b.ds || "0000").localeCompare(a.ds || "0000"),
      preco_asc: (a, b) => (a.valor ?? Infinity) - (b.valor ?? Infinity),
      preco_desc: (a, b) => (b.valor ?? -Infinity) - (a.valor ?? -Infinity),
      lugares_desc: (a, b) => (b.lug || 0) - (a.lug || 0),
      origem: (a, b) => cmpStr(a.origem, b.origem),
      destino: (a, b) => cmpStr(a.destino, b.destino),
      cia: (a, b) => cmpStr(a.cia, b.cia)
    }[s];
    // Na ordenação padrão, os Exclusivos Visual aparecem primeiro
    arr.sort((a, b) => (s === "data_asc" ? exclFirst(a, b) : 0) || (by ? by(a, b) : 0));
  }

  function updateFilterBadge() {
    const f = state.filters;
    let count = ["origem", "destino", "cia", "tipo", "dataIni", "dataFim", "lugaresMin", "valorMax"].filter(k => f[k] !== "").length;
    if (f.somenteDisp) count++;
    const badge = $("filterCountBadge");
    badge.style.display = count ? "inline-block" : "none";
    badge.textContent = count;
  }

  function updateIndicators() {
    const arr = state.filtered;
    animateNumber($("indTotal"), arr.length);
    animateNumber($("indLugares"), arr.reduce((s, r) => s + (r.lug || 0), 0));
    animateNumber($("indCias"), new Set(arr.map(r => r.cia).filter(Boolean)).size);
    animateNumber($("indRotas"), new Set(arr.map(r => r.origem + "-" + r.destino)).size);
    $("countNum").textContent = arr.length.toLocaleString("pt-BR");
  }
  function animateNumber(el, target) {
    const start = parseInt(el.textContent.replace(/\D/g, ""), 10) || 0;
    if (start === target || matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = target.toLocaleString("pt-BR"); return; }
    const dur = 350, t0 = performance.now();
    (function step(t) {
      const p = Math.min(1, (t - t0) / dur);
      el.textContent = Math.round(start + (target - start) * p).toLocaleString("pt-BR");
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  }

  /* ----------------------------------------------------------------
     8. RENDERIZAÇÃO
     ---------------------------------------------------------------- */
  function seatsChipClass(seats) {
    if (seats == null) return "";
    if (seats <= 0) return "none";
    if (seats <= 3) return "low";
    return "";
  }

  function cardHtml(r) {
    const isExcl = r.tipo !== "Bloqueio";
    const valor = fmtCurrency(r.valor);
    const semTaxa = fmtCurrency(valorSemTaxa(r.valor));
    const extras = [];
    if (r.rota) extras.push(`Rota ${escapeHtml(r.rota)}`);
    if (r.dias) extras.push(`${r.dias} dias`);
    if (r.noites != null) extras.push(`${r.noites} noites`);
        if (r.id) extras.push(`ID ${escapeHtml(r.id)}`);
    if (r.pacote) extras.push(escapeHtml(r.pacote));
    if (semTaxa) extras.push(`Sem taxa (estimado): ${semTaxa}`);

    return `
    <article class="opp-card ${isExcl ? "tipo-exclusivo" : ""}">
      <div class="card-top">
        <div class="route">
          <i class="fa-solid fa-plane" aria-hidden="true"></i>
          <span>${escapeHtml(r.origem || "—")}</span>
          <span class="arrow" aria-label="para">→</span>
          <span>${escapeHtml(r.destino || "—")}</span>
        </div>
        <div class="card-top-right">
          ${valor ? `<span class="price-tag">${valor}</span>` : `<span class="price-consult">Sob consulta</span>`}
          <span class="badge ${isExcl ? "badge-exclusivo" : "badge-bloqueio"}">${escapeHtml(r.tipo)}</span>
        </div>
      </div>
      <div class="card-info">
        <div class="info-item"><span class="lbl">Saída</span><span class="v"><i class="fa-regular fa-calendar"></i>${fmtDateBR(r.ds)}</span></div>
        <div class="info-item"><span class="lbl">Retorno</span><span class="v"><i class="fa-regular fa-calendar-check"></i>${fmtDateBR(r.dr)}</span></div>
        <div class="info-item"><span class="lbl">Lugares</span><span class="v"><span class="seats-chip ${seatsChipClass(r.lug)}"><i class="fa-solid fa-chair"></i>${r.lug == null ? "—" : r.lug}</span></span></div>
        ${r.area ? `<div class="info-item"><span class="lbl">Área</span><span class="v">${escapeHtml(r.area)}</span></div>`
          : `<div class="info-item"><span class="lbl">Localizador</span><span class="v">${escapeHtml(r.localizador || "—")}</span></div>`}
      </div>
      <div class="card-footer">
        <span class="cia-tag"><span class="cia-dot"></span>${escapeHtml(r.cia || "Não informado")}</span>
      </div>
      ${extras.length ? `<div class="card-obs">${extras.join(" · ")}</div>` : ""}
    </article>`;
  }

  function renderLoadError(err) {
    grid.innerHTML = `<div class="empty-state">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <h3>Não foi possível carregar as oportunidades</h3>
      <p>${navigator.onLine ? escapeHtml(err && err.message ? err.message : "Erro ao ler os dados.") : "Conecte-se à internet e toque em Tentar de novo."}</p>
      <button class="btn btn-primary" style="margin:14px auto 0" id="btnRetry"><i class="fa-solid fa-arrows-rotate"></i> Tentar de novo</button>
    </div>`;
    $("btnRetry").addEventListener("click", () => checkForUpdates({ manual: true }));
  }

  function renderReset() {
    grid.innerHTML = "";
    state.renderedCount = 0;
    if (!state.all.length) return;
    if (!state.filtered.length) {
      grid.innerHTML = `<div class="empty-state">
        <i class="fa-solid fa-plane-slash"></i>
        <h3>Nenhuma oportunidade encontrada</h3>
        <p>Ajuste os filtros ou o termo de busca.</p>
      </div>`;
      return;
    }
    renderNextBatch();
  }

  function renderNextBatch() {
    const start = state.renderedCount;
    const end = Math.min(state.filtered.length, start + state.pageSize);
    if (start >= end) return;
    let html = "";
    for (let i = start; i < end; i++) html += cardHtml(state.filtered[i]);
    const old = $("sentinel"); if (old) old.remove();
    grid.insertAdjacentHTML("beforeend", html);
    state.renderedCount = end;
    if (end < state.filtered.length) {
      grid.insertAdjacentHTML("beforeend", `<div id="sentinel"><i class="fa-solid fa-circle-notch fa-spin"></i> Carregando mais…</div>`);
      observeSentinel();
    }
  }
  let io = null;
  function observeSentinel() {
    const s = $("sentinel");
    if (!s) return;
    if (io) io.disconnect();
    io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) renderNextBatch(); }), { rootMargin: "400px" });
    io.observe(s);
  }

  /* ----------------------------------------------------------------
     9. AÇÕES
     ---------------------------------------------------------------- */
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._tm);
    toast._tm = setTimeout(() => t.classList.remove("show"), 2600);
  }

  function exportExcel() {
    try {
      if (typeof XLSX === "undefined") { toast("Exportação indisponível neste navegador."); return; }
      const rows = state.filtered.map(r => {
        const o = {
          "Tipo": r.tipo, "Origem": r.origem, "Destino": r.destino, "Rota": r.rota || "",
          "Data Saída": fmtDateBR(r.ds), "Data Retorno": fmtDateBR(r.dr),
          "Dias": r.dias ?? "", "Noites": r.noites ?? "",
          "Companhia": r.cia, "Lugares Disponíveis": r.lug ?? "",
          "Valor final c/ taxa (R$)": r.valor ?? "Sob consulta", "Área": r.area || ""
        };
        if (CONFIG.regraSemTaxa) o["Valor s/ taxa estimado (R$)"] = valorSemTaxa(r.valor) ?? "";
        if (r.localizador) o["Localizador"] = r.localizador;
        return o;
      });
      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Oportunidades");
      XLSX.writeFile(wb, `oportunidades_visual_turismo_${todayISO()}.xlsx`);
      toast("Planilha exportada.");
    } catch (err) {
      console.error(err);
      toast("Não foi possível exportar neste navegador.");
    }
  }

  function shareResults() {
    const url = location.href.split("#")[0];
    const txt = `Oportunidades Aéreas · Visual Turismo — ${state.filtered.length.toLocaleString("pt-BR")} oportunidades.`;
    if (navigator.share) {
      navigator.share({ title: "Oportunidades Aéreas · Visual Turismo", text: txt, url }).catch(() => {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(`${txt}\n${url}`).then(() => toast("Link copiado."), () => toast("Não foi possível copiar o link."));
    } else toast("Compartilhamento indisponível neste navegador.");
  }

  /* ----------------------------------------------------------------
     10. TEMA CLARO/ESCURO (segue o celular, a menos que o usuário escolha)
     ---------------------------------------------------------------- */
  const darkMQ = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
  function savedTheme() { try { return localStorage.getItem("vt_dark"); } catch (e) { return null; } }
  function applyTheme() {
    const s = savedTheme();
    const dark = s === "1" || (s === null && darkMQ && darkMQ.matches);
    document.body.classList.toggle("dark", dark);
    $("darkToggle").innerHTML = dark ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
    document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#0A1826" : "#003E7E");
  }

  /* ----------------------------------------------------------------
     11. AVISO DE INSTALAÇÃO
     ---------------------------------------------------------------- */
  let deferredPrompt = null;
  function setupInstallBanner() {
    const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
    let dismissed = false;
    try { dismissed = localStorage.getItem("vt_install_dismissed") === "1"; } catch (e) {}
    if (standalone || dismissed) return;
    const banner = $("installBanner"), text = $("installText");
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (isIOS) {
      text.innerHTML = 'Instale o app: no Safari, toque em <b>Compartilhar</b> <i class="fa-solid fa-arrow-up-from-bracket"></i> e depois em <b>Adicionar à Tela de Início</b>.';
      banner.hidden = false;
    }
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      text.innerHTML = 'Instale o app na tela inicial para abrir mais rápido, mesmo sem internet.' +
        '<div class="ib-actions"><button class="btn btn-primary" id="btnInstall"><i class="fa-solid fa-download"></i> Instalar app</button></div>';
      banner.hidden = false;
      $("btnInstall").addEventListener("click", async () => {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice.catch(() => {});
        deferredPrompt = null;
        banner.hidden = true;
      });
    });
    $("installClose").addEventListener("click", () => {
      banner.hidden = true;
      try { localStorage.setItem("vt_install_dismissed", "1"); } catch (e) {}
    });
  }

  /* ----------------------------------------------------------------
     12. EVENTOS
     ---------------------------------------------------------------- */
  function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

  function bindEvents() {
    $("globalSearch").addEventListener("input", debounce((e) => {
      state.search = e.target.value;
      $("searchClear").style.display = state.search ? "flex" : "none";
      applyFilters();
    }, 180));
    $("globalSearch").addEventListener("keydown", (e) => { if (e.key === "Enter") e.target.blur(); });
    $("searchClear").addEventListener("click", () => {
      $("globalSearch").value = ""; state.search = "";
      $("searchClear").style.display = "none";
      applyFilters();
    });
    $("filtersToggle").addEventListener("click", () => {
      $("filtersToggle").classList.toggle("open");
      $("filtersPanel").classList.toggle("open");
    });
    [["fOrigem", "origem"], ["fDestino", "destino"], ["fCia", "cia"], ["fTipo", "tipo"], ["fDataIni", "dataIni"], ["fDataFim", "dataFim"]]
      .forEach(([id, key]) => $(id).addEventListener("change", (e) => { state.filters[key] = e.target.value; applyFilters(); }));
    $("fLugaresMin").addEventListener("input", debounce((e) => { state.filters.lugaresMin = e.target.value; applyFilters(); }, 250));
    $("fValorMax").addEventListener("input", debounce((e) => { state.filters.valorMax = e.target.value; applyFilters(); }, 250));
    $("fSomenteDisponivel").addEventListener("change", (e) => { state.filters.somenteDisp = e.target.checked; applyFilters(); });
    $("btnLimpar").addEventListener("click", () => {
      state.filters = { ...EMPTY_FILTERS };
      ["fOrigem", "fDestino", "fCia", "fTipo", "fDataIni", "fDataFim", "fLugaresMin", "fValorMax"].forEach(id => $(id).value = "");
      $("fSomenteDisponivel").checked = false;
      $("globalSearch").value = ""; state.search = ""; $("searchClear").style.display = "none";
      applyFilters();
      toast("Filtros limpos.");
    });
    $("sortSelect").addEventListener("change", (e) => { state.sort = e.target.value; sortFiltered(); renderReset(); });
    $("btnExport").addEventListener("click", exportExcel);
    $("btnPrint").addEventListener("click", () => window.print());
    $("btnShare").addEventListener("click", shareResults);
    $("statusLine").addEventListener("click", () => checkForUpdates({ manual: true }));

    $("darkToggle").addEventListener("click", () => {
      const dark = !document.body.classList.contains("dark");
      try { localStorage.setItem("vt_dark", dark ? "1" : "0"); } catch (e) {}
      applyTheme();
    });
    if (darkMQ && darkMQ.addEventListener) darkMQ.addEventListener("change", applyTheme);

    window.addEventListener("scroll", debounce(() => $("backToTop").classList.toggle("show", scrollY > 600), 60), { passive: true });
    $("backToTop").addEventListener("click", () => scrollTo({ top: 0, behavior: "smooth" }));

    // Ao voltar para o app ou recuperar a internet, procura versão nova
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && Date.now() - state.lastCheck > CONFIG.reverificarAposMinutos * 60000) checkForUpdates();
    });
    window.addEventListener("online", () => checkForUpdates());
    window.addEventListener("offline", () => { if (state.all.length) setStatus("offline", "Sem internet · " + stampText().replace("Atualizado", "versão salva")); });
  }

  /* ----------------------------------------------------------------
     13. INICIALIZAÇÃO
     ---------------------------------------------------------------- */
  function hideSplash() { const s = $("splash"); if (s) s.classList.add("hide"); }

  async function init() {
    applyTheme();
    bindEvents();
    setupInstallBanner();

    // 1) Mostra imediatamente a última versão salva no aparelho
    const [records, meta] = await Promise.all([DB.get("records"), DB.get("meta")]);
    if (records && records.length) {
      state.meta = meta;
      setData(records);
      setStatus("checking", stampText() + " · verificando…");
      hideSplash();
    }
    // 2) Procura versão nova (o leitor de planilha é carregado com "defer")
    checkForUpdates();

    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      navigator.serviceWorker.register("sw.js").catch(e => console.warn("Service worker não registrado:", e));
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    init().catch(err => { console.error("Erro na inicialização:", err); hideSplash(); renderLoadError(err); });
  });
})();
</script>
</body>
